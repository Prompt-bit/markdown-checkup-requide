name: CheckUp Requide Build

on:
  push:
    paths:
      - "*.cqr"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert .cqr to HTML
        run: |
          python checkup.py

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add *.html
          git commit -m "Auto-generate HTML from CheckUp Requide" || echo "No changes to commit"
          git pull --rebase
          git push
